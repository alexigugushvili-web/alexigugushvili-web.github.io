<header class="site-header">
  <div class="header-inner">
    <a href="/" class="site-logo">{{ .Site.Title }}</a>
    <button class="menu-toggle" aria-label="Toggle menu" onclick="document.querySelector('.nav-menu').classList.toggle('open')">
      <span></span><span></span><span></span>
    </button>
    <nav class="nav-menu">
      {{ range .Site.Menus.main }}
        <a href="{{ .URL }}" class="{{ if $.IsMenuCurrent "main" . }}active{{ end }}">{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
